services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kilele
      POSTGRES_USER: kilele
      POSTGRES_PASSWORD: kilele
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kilele -d kilele"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://kilele:kilele@postgres:5432/kilele
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env before running docker compose}
      ENVIRONMENT: production
      DEBUG: "False"
      API_BASE_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:8501,http://frontend:8501
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      DATABASE_URL: postgresql://kilele:kilele@postgres:5432/kilele
      API_BASE_URL: http://backend:8000
      ENVIRONMENT: production
      DEBUG: "False"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
