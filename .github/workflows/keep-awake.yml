name: Keep free deployment awake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-free-deployment-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ping deployed app and API
        env:
          KILELE_FRONTEND_URL: https://kilele-hiking-appgit-cnrnmlnmkgku6xjzrrxzcg.streamlit.app/
          KILELE_BACKEND_HEALTH_URL: https://kilele-hiking-api.onrender.com/health
        run: python scripts/keep_awake.py
