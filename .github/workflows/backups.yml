name: Encrypted backups

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: encrypted-backups
  cancel-in-progress: false

jobs:
  snapshot-and-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      restore:
        image: postgres:18
        env:
          POSTGRES_USER: restore
          POSTGRES_PASSWORD: temporary-ci-only
          POSTGRES_DB: restore_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BACKUP_DIR: backups
      PG_TOOLS_DOCKER: "1"
      RESTORE_DATABASE_URL: postgresql://restore:temporary-ci-only@127.0.0.1:5432/restore_check?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backup dependencies
        run: python -m pip install 'sqlalchemy>=2,<3' 'psycopg2-binary>=2.9,<3' 'cryptography>=44'
      - name: Encrypted snapshot
        run: |
          python scripts/record_operation.py running
          python backend/backup_service.py create
      - name: Restore into disposable database
        run: python backend/backup_service.py restore --file "$(find backups -name '*.enc' -print -quit)"
      - name: Validate restored application tables
        run: python scripts/verify_restore.py
      - name: Store encrypted backup only
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-database-${{ github.run_id }}
          path: backups/*.enc
          retention-days: 7
          if-no-files-found: error
      - name: Record backup outcome
        if: always()
        env:
          BACKUP_JOB_STATUS: ${{ job.status }}
        run: python scripts/record_operation.py "$BACKUP_JOB_STATUS"
