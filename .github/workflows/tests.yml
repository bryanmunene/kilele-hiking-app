name: Tests

on:
  push:
    branches: [main, codex/hiking-journey-ops]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: kilele_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://test:disposable-test-only@127.0.0.1:5432/kilele_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall backend frontend tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Deployment readiness
        run: python deployment_check.py

  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-hosted.txt
            frontend/requirements.txt
            backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium
      - name: Browser journeys and accessibility
        run: pnpm exec playwright test
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
