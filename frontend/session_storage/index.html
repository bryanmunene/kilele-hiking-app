<!doctype html>
<html lang="en"><head><meta charset="utf-8"></head><body>
<script>
const send = (type, data = {}) => window.parent.postMessage({isStreamlitMessage: true, type, ...data}, '*');
window.addEventListener('message', (event) => {
  if (event.source !== window.parent || event.data.type !== 'streamlit:render') return;
  const args = event.data.args;
  let token = '';
  try {
    if (args.operation === 'write') localStorage.setItem('kilele_session_token', args.token);
    if (args.operation === 'clear') localStorage.removeItem('kilele_session_token');
    token = localStorage.getItem('kilele_session_token') || '';
  } catch (_) { /* Login still works when browser storage is disabled. */ }
  send('streamlit:setComponentValue', {value: {token, operation: args.operation}, dataType: 'json'});
  send('streamlit:setFrameHeight', {height: 0});
});
send('streamlit:componentReady', {apiVersion: 1});
</script></body></html>
